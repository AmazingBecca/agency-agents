name: Publish Intelligence OS Retained Evidence

on:
  workflow_call:
    inputs:
      envelope_b64:
        required: true
        type: string
      repository:
        required: true
        type: string
      reviewed_head:
        required: true
        type: string
      reviewed_base:
        required: true
        type: string
      synthetic_merge:
        required: true
        type: string
      workflow_ref:
        required: true
        type: string
      workflow_sha:
        required: true
        type: string
      run_id:
        required: true
        type: string
      run_attempt:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      GIT_TERMINAL_PROMPT: '0'
      BASH_ENV: ''
      ENV: ''
      LD_PRELOAD: ''
      LD_AUDIT: ''
      LD_LIBRARY_PATH: ''
      PYTHONHOME: ''
      PYTHONPATH: ''
      PYTHONSTARTUP: ''
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: '/dev/null'
      GIT_CONFIG_SYSTEM: '/dev/null'
      GIT_CONFIG_COUNT: '0'
      GIT_CONFIG_PARAMETERS: ''
    steps:
      - name: Bind protected publisher identity before source fetch
        shell: bash
        env:
          CONTROL_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CONTROL_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          CONTROL_WORKFLOW_REF: ${{ job.workflow_ref }}
          CONTROL_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          test "$CONTROL_WORKFLOW_REPOSITORY" = 'AmazingBecca/agency-agents'
          test "$CONTROL_WORKFLOW_FILE_PATH" = '.github/workflows/publish-retained-evidence.yml'
          [[ "$CONTROL_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONTROL_WORKFLOW_REF" = "$CONTROL_WORKFLOW_REPOSITORY/$CONTROL_WORKFLOW_FILE_PATH@$CONTROL_WORKFLOW_SHA"
      - name: Fetch exact public publisher source without caller credentials
        shell: bash
        env:
          CONTROL_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CONTROL_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          test "$CONTROL_WORKFLOW_REPOSITORY" = 'AmazingBecca/agency-agents'
          [[ "$CONTROL_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          unset GITHUB_TOKEN GH_TOKEN
          git init .
          git remote add origin 'https://github.com/AmazingBecca/agency-agents.git'
          git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 origin "$CONTROL_WORKFLOW_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CONTROL_WORKFLOW_SHA"
          test "$(git remote get-url origin)" = 'https://github.com/AmazingBecca/agency-agents.git'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Seal immutable publisher Python runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$pythonLocation" = /opt/hostedtoolcache/Python/3.12.13/* ]]
          test "$(stat -c '%u:%g:%a' /usr)" = "0:0:755"
          test "$(stat -c '%u:%g:%a' /usr/local)" = "0:0:755"
          test "$(stat -c '%u:%g:%a' /usr/local/lib)" = "0:0:755"
          runtime_root="/usr/local/lib/amazingbecca-publisher-python-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$runtime_root"
          sudo mv -- "$pythonLocation" "$runtime_root"
          sudo chown -R root:root "$runtime_root"
          sudo chmod -R a-w "$runtime_root"
          control_python="$runtime_root/bin/python3.12"
          test -x "$control_python"
          test "$(stat -c '%u:%g:%a' "$control_python")" = "0:0:555"
          test "$(stat -c '%u:%g:%a' "$runtime_root")" = "0:0:555"
          LD_LIBRARY_PATH="$runtime_root/lib" "$control_python" -I -c 'import pathlib,sys; p=pathlib.Path(sys.executable).resolve(strict=True); assert str(p).startswith("/usr/local/lib/amazingbecca-publisher-python-"); assert pathlib.Path(sys.base_prefix).resolve(strict=True) == p.parent.parent'
          printf 'CONTROL_PYTHON=%s\n' "$control_python" >> "$GITHUB_ENV"
          printf 'LD_LIBRARY_PATH=%s\n' "$runtime_root/lib" >> "$GITHUB_ENV"
      - name: Compile exact publisher sources with sealed runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          "$CONTROL_PYTHON" -I -m py_compile \
            intelligence-os-control/publish_retained_evidence.py \
            intelligence-os-control/publication_attestation.py
      - name: Materialize independently verified receipt
        id: publish
        shell: bash
        env:
          TRANSFER_ENVELOPE_B64: ${{ inputs.envelope_b64 }}
          PUBLISH_REPOSITORY: ${{ inputs.repository }}
          PUBLISH_REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          PUBLISH_REVIEWED_BASE: ${{ inputs.reviewed_base }}
          PUBLISH_SYNTHETIC_MERGE: ${{ inputs.synthetic_merge }}
          PUBLISH_WORKFLOW_REF: ${{ inputs.workflow_ref }}
          PUBLISH_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          PUBLISH_RUN_ID: ${{ inputs.run_id }}
          PUBLISH_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          CONTROL_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CONTROL_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          CONTROL_WORKFLOW_REF: ${{ job.workflow_ref }}
          CONTROL_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          output="$RUNNER_TEMP/intelligence-os-wheelhouse-verification.json"
          test ! -e "$output"
          receipt_sha256="$("$CONTROL_PYTHON" -I intelligence-os-control/publish_retained_evidence.py \
            --output "$output" \
            --repository "$PUBLISH_REPOSITORY" \
            --reviewed-head "$PUBLISH_REVIEWED_HEAD" \
            --reviewed-base "$PUBLISH_REVIEWED_BASE" \
            --synthetic-merge "$PUBLISH_SYNTHETIC_MERGE" \
            --workflow-ref "$PUBLISH_WORKFLOW_REF" \
            --workflow-sha "$PUBLISH_WORKFLOW_SHA" \
            --run-id "$PUBLISH_RUN_ID" \
            --run-attempt "$PUBLISH_RUN_ATTEMPT")"
          [[ "$receipt_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$output" | cut -d' ' -f1)" = "$receipt_sha256"
          test "$(stat -c '%a' "$output")" = 600
          printf 'receipt_sha256=%s\n' "$receipt_sha256" >> "$GITHUB_OUTPUT"
      - name: Bind publisher authority into retained evidence
        id: attest
        shell: bash
        env:
          EXPECTED_RECEIPT_SHA256: ${{ steps.publish.outputs.receipt_sha256 }}
          PUBLISH_REPOSITORY: ${{ inputs.repository }}
          PUBLISH_REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          PUBLISH_REVIEWED_BASE: ${{ inputs.reviewed_base }}
          PUBLISH_SYNTHETIC_MERGE: ${{ inputs.synthetic_merge }}
          PUBLISH_WORKFLOW_REF: ${{ inputs.workflow_ref }}
          PUBLISH_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          PUBLISH_RUN_ID: ${{ inputs.run_id }}
          PUBLISH_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          CONTROL_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CONTROL_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          CONTROL_WORKFLOW_REF: ${{ job.workflow_ref }}
          CONTROL_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          receipt="$RUNNER_TEMP/intelligence-os-wheelhouse-verification.json"
          output="$RUNNER_TEMP/intelligence-os-retained-evidence-publication.json"
          test ! -e "$output"
          publication_sha256="$("$CONTROL_PYTHON" -I intelligence-os-control/publication_attestation.py \
            --receipt "$receipt" \
            --output "$output" \
            --expected-receipt-sha256 "$EXPECTED_RECEIPT_SHA256" \
            --repository "$PUBLISH_REPOSITORY" \
            --reviewed-head "$PUBLISH_REVIEWED_HEAD" \
            --reviewed-base "$PUBLISH_REVIEWED_BASE" \
            --synthetic-merge "$PUBLISH_SYNTHETIC_MERGE" \
            --workflow-ref "$PUBLISH_WORKFLOW_REF" \
            --workflow-sha "$PUBLISH_WORKFLOW_SHA" \
            --run-id "$PUBLISH_RUN_ID" \
            --run-attempt "$PUBLISH_RUN_ATTEMPT")"
          [[ "$publication_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$output" | cut -d' ' -f1)" = "$publication_sha256"
          test "$(stat -c '%a' "$output")" = 600
          printf 'publication_sha256=%s\n' "$publication_sha256" >> "$GITHUB_OUTPUT"
      - name: Seal retained evidence as explicit non-promotion diagnostic
        id: diagnostic
        shell: bash
        env:
          EXPECTED_PUBLICATION_SHA256: ${{ steps.attest.outputs.publication_sha256 }}
        run: |
          set -Eeuo pipefail
          umask 077
          publication="$RUNNER_TEMP/intelligence-os-retained-evidence-publication.json"
          output="$RUNNER_TEMP/intelligence-os-retained-evidence-diagnostic.json"
          test ! -e "$output"
          "$CONTROL_PYTHON" -I - "$publication" "$output" "$EXPECTED_PUBLICATION_SHA256" <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import sys

          publication_path = pathlib.Path(sys.argv[1])
          output_path = pathlib.Path(sys.argv[2])
          expected_digest = sys.argv[3]
          if len(expected_digest) != 64 or any(c not in "0123456789abcdef" for c in expected_digest):
              raise SystemExit("invalid publication digest")
          if publication_path.name != "intelligence-os-retained-evidence-publication.json":
              raise SystemExit("invalid publication path")
          if output_path.name != "intelligence-os-retained-evidence-diagnostic.json":
              raise SystemExit("invalid diagnostic path")
          before = publication_path.stat(follow_symlinks=False)
          if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or stat.S_IMODE(before.st_mode) != 0o600:
              raise SystemExit("publication metadata outside policy")
          raw = publication_path.read_bytes()
          after = publication_path.stat(follow_symlinks=False)
          if (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns):
              raise SystemExit("publication changed during read")
          observed_digest = hashlib.sha256(raw).hexdigest()
          if observed_digest != expected_digest:
              raise SystemExit("publication digest mismatch")
          value = json.loads(raw.decode("ascii"))
          canonical = (json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=True) + "\n").encode("ascii")
          if raw != canonical or value.get("schema") != "amazingbecca.intelligence-os-retained-evidence-publication.v1":
              raise SystemExit("publication schema or canonicality invalid")
          diagnostic = {
              "schema": "amazingbecca.intelligence-os-retained-evidence-diagnostic.v1",
              "authority_level": "retained-diagnostic-not-promotion",
              "promotion_authority_ready": False,
              "promotion_authorized": False,
              "publication": {
                  "name": publication_path.name,
                  "encoding": "base64",
                  "bytes": len(raw),
                  "sha256": observed_digest,
                  "data": base64.b64encode(raw).decode("ascii"),
              },
          }
          diagnostic_raw = (json.dumps(diagnostic, sort_keys=True, separators=(",", ":"), ensure_ascii=True) + "\n").encode("ascii")
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
          fd = os.open(output_path, flags, 0o600)
          try:
              os.write(fd, diagnostic_raw)
              os.fsync(fd)
          finally:
              os.close(fd)
          PY
          test "$(stat -c '%a' "$output")" = 600
          diagnostic_sha256="$(sha256sum "$output" | cut -d' ' -f1)"
          [[ "$diagnostic_sha256" =~ ^[0-9a-f]{64}$ ]]
          "$CONTROL_PYTHON" -I - "$output" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="ascii"))
          assert value["authority_level"] == "retained-diagnostic-not-promotion"
          assert value["promotion_authority_ready"] is False
          assert value["promotion_authorized"] is False
          PY
          printf 'diagnostic_sha256=%s\n' "$diagnostic_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload explicitly non-promotion retained diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intelligence-os-retained-evidence-diagnostic-not-promotion-head-${{ inputs.reviewed_head }}-merge-${{ inputs.synthetic_merge }}-publisher-${{ job.workflow_sha }}-run-${{ inputs.run_id }}-${{ inputs.run_attempt }}
          path: ${{ runner.temp }}/intelligence-os-retained-evidence-diagnostic.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: false
          include-hidden-files: false
