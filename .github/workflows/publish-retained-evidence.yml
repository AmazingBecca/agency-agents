name: Publish Intelligence OS Retained Evidence

on:
  workflow_call:
    inputs:
      envelope_b64:
        required: true
        type: string
      repository:
        required: true
        type: string
      reviewed_head:
        required: true
        type: string
      reviewed_base:
        required: true
        type: string
      synthetic_merge:
        required: true
        type: string
      workflow_ref:
        required: true
        type: string
      workflow_sha:
        required: true
        type: string
      run_id:
        required: true
        type: string
      run_attempt:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Check out exact protected publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Bind protected publisher source
        shell: bash
        env:
          CONTROL_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CONTROL_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          CONTROL_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          test "$CONTROL_WORKFLOW_REPOSITORY" = 'AmazingBecca/agency-agents'
          test "$CONTROL_WORKFLOW_FILE_PATH" = '.github/workflows/publish-retained-evidence.yml'
          [[ "$CONTROL_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CONTROL_WORKFLOW_SHA"
          test "$(git remote get-url origin)" = 'https://github.com/AmazingBecca/agency-agents'
          python -m py_compile intelligence-os-control/publish_retained_evidence.py
      - name: Materialize independently verified receipt
        id: publish
        shell: bash
        env:
          TRANSFER_ENVELOPE_B64: ${{ inputs.envelope_b64 }}
          PUBLISH_REPOSITORY: ${{ inputs.repository }}
          PUBLISH_REVIEWED_HEAD: ${{ inputs.reviewed_head }}
          PUBLISH_REVIEWED_BASE: ${{ inputs.reviewed_base }}
          PUBLISH_SYNTHETIC_MERGE: ${{ inputs.synthetic_merge }}
          PUBLISH_WORKFLOW_REF: ${{ inputs.workflow_ref }}
          PUBLISH_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          PUBLISH_RUN_ID: ${{ inputs.run_id }}
          PUBLISH_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          CONTROL_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CONTROL_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          CONTROL_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          output="$RUNNER_TEMP/intelligence-os-wheelhouse-verification.json"
          test ! -e "$output"
          receipt_sha256="$(python -I intelligence-os-control/publish_retained_evidence.py \
            --output "$output" \
            --repository "$PUBLISH_REPOSITORY" \
            --reviewed-head "$PUBLISH_REVIEWED_HEAD" \
            --reviewed-base "$PUBLISH_REVIEWED_BASE" \
            --synthetic-merge "$PUBLISH_SYNTHETIC_MERGE" \
            --workflow-ref "$PUBLISH_WORKFLOW_REF" \
            --workflow-sha "$PUBLISH_WORKFLOW_SHA" \
            --run-id "$PUBLISH_RUN_ID" \
            --run-attempt "$PUBLISH_RUN_ATTEMPT")"
          [[ "$receipt_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$output" | cut -d' ' -f1)" = "$receipt_sha256"
          test "$(stat -c '%a' "$output")" = 600
          printf 'receipt_sha256=%s\n' "$receipt_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload exact retained verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intelligence-os-wheelhouse-verification-head-${{ inputs.reviewed_head }}-merge-${{ inputs.synthetic_merge }}-run-${{ inputs.run_id }}-${{ inputs.run_attempt }}
          path: ${{ runner.temp }}/intelligence-os-wheelhouse-verification.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          overwrite: false
          include-hidden-files: false
