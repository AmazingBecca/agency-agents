name: Agent Node Native Runtime v24 Exact Repair

on:
  push:
    branches:
      - hardening/agent-node-native-runtime-closure-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact repair boundary
        shell: bash
        env:
          EXPECTED_PARENT: 4f29ecc3896e6283416b834d15445bf00d02a780
          EXPECTED_SOURCE_BLOB: 223883bc7ca6f3733dddd77a883bf50c8723af1d
          EXPECTED_TEST_BLOB: c6ce8bf1ed031e41cbbfdb92965a608ae8a7fa5e
        run: |
          set -Eeuo pipefail
          export PATH='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          unset GH_TOKEN
          test "$GITHUB_REF" = 'refs/heads/hardening/agent-node-native-runtime-closure-v1'
          test -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)"
          git init .
          git remote add origin 'https://github.com/AmazingBecca/agency-agents.git'
          git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git hash-object agent-node/agent_node.py)" = "$EXPECTED_SOURCE_BLOB"
          test "$(git hash-object agent-node/tests/test_native_runtime_string_table_overlap.py)" = "$EXPECTED_TEST_BLOB"
      - name: Apply, test, self-remove, and fast-forward exact repair
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_BLOB: 223883bc7ca6f3733dddd77a883bf50c8723af1d
          EXPECTED_TEST_BLOB: c6ce8bf1ed031e41cbbfdb92965a608ae8a7fa5e
        run: |
          set -Eeuo pipefail
          export PATH='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          python3 agent-node/repair_native_runtime_v24.py
          NEW_SOURCE_BLOB="$(git hash-object agent-node/agent_node.py)"
          test "$NEW_SOURCE_BLOB" != "$EXPECTED_SOURCE_BLOB"
          test "$(git hash-object agent-node/tests/test_native_runtime_string_table_overlap.py)" = "$EXPECTED_TEST_BLOB"
          grep -F "test \"\$(git hash-object agent-node/agent_node.py)\" = '$NEW_SOURCE_BLOB'" .github/workflows/agent-node-native-runtime-closure.yml
          grep -F "test \"\$(git hash-object agent-node/tests/test_native_runtime_string_table_overlap.py)\" = '$EXPECTED_TEST_BLOB'" .github/workflows/agent-node-native-runtime-closure.yml
          python3 -B -m py_compile \
            agent-node/agent_node.py \
            agent-node/tests/test_agent_node.py \
            agent-node/tests/test_agent_node_adversarial_paths.py \
            agent-node/tests/test_runtime_closure.py \
            agent-node/tests/test_runtime_zip_archive.py \
            agent-node/tests/test_native_runtime_closure.py \
            agent-node/tests/test_native_runtime_multiline_spoof.py \
            agent-node/tests/test_native_runtime_pt_dynamic_size.py \
            agent-node/tests/test_native_runtime_string_table_overlap.py
          python3 -B -m unittest discover -s agent-node/tests -v
          git rm agent-node/repair_native_runtime_v24.py .github/workflows/agent-node-native-runtime-repair-v24.yml
          git add agent-node/agent_node.py .github/workflows/agent-node-native-runtime-closure.yml
          git config user.name 'AmazingBecca Runtime Repair'
          git config user.email '134438105+AmazingBecca@users.noreply.github.com'
          git commit -m 'security: validate loader-equivalent page mappings'
          REMOTE_HEAD="$(git ls-remote origin refs/heads/hardening/agent-node-native-runtime-closure-v1 | cut -f1)"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          AUTH="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/hardening/agent-node-native-runtime-closure-v1
