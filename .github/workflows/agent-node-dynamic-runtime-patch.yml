name: Agent Node Dynamic Runtime Patch

on:
  push:
    branches:
      - hardening/agent-node-dynamic-runtime-closure-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Apply exact dynamic-runtime repair
        shell: bash
        env:
          EXPECTED_PARENT: f8cea48510bb02095630153e92e1220b14858779
          EXPECTED_SOURCE_BLOB: 678f8fa92964601e35843317347cba7e156839ce
          EXPECTED_RUNTIME_TEST_BLOB: 5d333babe635de2325adf3e4a2ef2b23a3ca98e3
          BRANCH: hardening/agent-node-dynamic-runtime-closure-v2
        run: |
          set -Eeuo pipefail
          export PATH='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          test "${{ github.ref_name }}" = "$BRANCH"
          git init .
          git remote add origin 'https://x-access-token:${{ github.token }}@github.com/AmazingBecca/agency-agents.git'
          git fetch --no-tags --depth=2 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git hash-object agent-node/agent_node.py)" = "$EXPECTED_SOURCE_BLOB"
          test "$(git hash-object agent-node/tests/test_runtime_closure.py)" = "$EXPECTED_RUNTIME_TEST_BLOB"
          python3 - <<'PY'
          from pathlib import Path

          source = Path('agent-node/agent_node.py')
          text = source.read_text(encoding='utf-8')
          if text.count('RUNTIME_POLICY = "agent-node-python-runtime-v20"') != 1:
              raise SystemExit('runtime policy boundary missing')
          text = text.replace('RUNTIME_POLICY = "agent-node-python-runtime-v20"', 'RUNTIME_POLICY = "agent-node-python-runtime-v21"', 1)
          start = text.index('def run_tests(expected_head: str, selector: str) -> dict:\n')
          end = text.index('\ndef second_opinion(expected_head: str, compact_evidence: str) -> dict:\n', start)
          new = r'''
def run_tests(expected_head: str, selector: str) -> dict:
    if not TEST_ALLOWLIST or selector not in TEST_ALLOWLIST:
        raise ValueError("test selector not allowlisted")
    supervisor = r"""
import json,os,signal,subprocess,sys,tempfile,time
root,selector=sys.argv[1:3]
inner=(
    "import os,signal,sys,unittest;"
    "root,selector=sys.argv[1:3];"
    "sys.path.insert(0,root);"
    "suite=unittest.defaultTestLoader.loadTestsFromName(selector);"
    "result=unittest.TextTestRunner(verbosity=2).run(suite);"
    "code=0 if result.wasSuccessful() else 1;"
    "os.kill(os.getpid(), signal.SIGSTOP);"
    "raise SystemExit(code)"
)
with tempfile.TemporaryFile(mode="w+t", encoding="utf-8") as output:
    proc=subprocess.Popen(
        [sys.executable,"-I","-B","-S","-c",inner,root,selector],
        cwd=root,text=True,stdout=output,stderr=subprocess.STDOUT,env=os.environ.copy(),
    )
    deadline=time.monotonic()+900
    paths=set()
    try:
        while True:
            waited,status=os.waitpid(proc.pid, os.WUNTRACED | os.WNOHANG)
            if waited==proc.pid:
                if os.WIFSTOPPED(status):
                    if os.WSTOPSIG(status)!=signal.SIGSTOP:
                        raise RuntimeError("test child stopped unexpectedly")
                    break
                proc.returncode=os.waitstatus_to_exitcode(status)
                raise RuntimeError("test child exited before runtime mapping capture")
            if time.monotonic()>=deadline:
                proc.kill(); proc.wait()
                raise TimeoutError("test child timed out before runtime mapping capture")
            time.sleep(0.01)
        with open(f"/proc/{proc.pid}/maps","r",encoding="utf-8") as handle:
            for line in handle:
                parts=line.rstrip("\n").split(None,5)
                if len(parts)<6 or "x" not in parts[1]:
                    continue
                value=parts[5]
                if value.startswith("/") and not value.endswith(" (deleted)"):
                    paths.add(value)
        if not paths:
            raise RuntimeError("test child exposed no executable file mappings")
        os.kill(proc.pid, signal.SIGCONT)
        remaining=max(0.1, deadline-time.monotonic())
        returncode=proc.wait(timeout=remaining)
    finally:
        if proc.poll() is None:
            try:
                os.kill(proc.pid, signal.SIGCONT)
            except ProcessLookupError:
                pass
            proc.kill(); proc.wait()
    output.seek(0)
    visible=output.read()
sys.stdout.write(visible)
payload=json.dumps(sorted(paths),separators=(",",":"),ensure_ascii=False).encode("utf-8","surrogateescape").hex()
sys.stdout.write("\n__AGENT_NODE_EXEC_NATIVE_V1__="+payload+"\n")
raise SystemExit(returncode)
"""
    python_bin, baseline_runtime_sha256 = python_runtime_identity()
    marker = "\n__AGENT_NODE_EXEC_NATIVE_V1__="
    with committed_snapshot(expected_head) as (head, tree, snapshot):
        cp = subprocess.run(
            [python_bin, "-I", "-B", "-S", "-c", supervisor, str(snapshot), selector],
            cwd=snapshot,
            text=True,
            stdout=subprocess.PIPE,
            stderr=subprocess.STDOUT,
            timeout=900,
            env=_python_env(),
        )
        if marker not in cp.stdout:
            raise RuntimeError("test supervisor did not return native mapping evidence")
        returned_output, encoded_paths = cp.stdout.rsplit(marker, 1)
        encoded_paths = encoded_paths.strip()
        try:
            decoded_paths = json.loads(bytes.fromhex(encoded_paths).decode("utf-8", "surrogateescape"))
        except (ValueError, UnicodeDecodeError, json.JSONDecodeError) as exc:
            raise RuntimeError("test supervisor returned invalid native mapping evidence") from exc
        if not isinstance(decoded_paths, list) or not decoded_paths or any(not isinstance(value, str) for value in decoded_paths):
            raise RuntimeError("test supervisor returned invalid native mapping list")
        execution_native_paths = tuple(pathlib.Path(value) for value in decoded_paths)
        execution_native_sha256 = _runtime_native_sha256(execution_native_paths)
        runtime_sha256 = hashlib.sha256(
            canonical(
                {
                    "baseline_runtime_sha256": baseline_runtime_sha256,
                    "execution_native_sha256": execution_native_sha256,
                }
            )
        ).hexdigest()
        returned_output = returned_output[-TEST_OUTPUT_LIMIT:]
    after_python_bin, after_runtime_sha256 = python_runtime_identity()
    if after_python_bin != python_bin or after_runtime_sha256 != baseline_runtime_sha256:
        raise RuntimeError("Python runtime identity changed during test execution")
    return {
        "head": head,
        "tree": tree,
        "runtime_sha256": runtime_sha256,
        "baseline_runtime_sha256": baseline_runtime_sha256,
        "execution_native_sha256": execution_native_sha256,
        "selector": selector,
        "returncode": cp.returncode,
        "stdout_sha256": hashlib.sha256(returned_output.encode()).hexdigest(),
        "stdout": returned_output,
    }
'''.lstrip()
          text = text[:start] + new + text[end:]
          source.write_text(text, encoding='utf-8')

          test = Path('agent-node/tests/test_runtime_closure.py')
          t = test.read_text(encoding='utf-8')
          old = 'completed = subprocess.CompletedProcess(args=[], returncode=0, stdout="OK\\n")'
          new_completed = 'completed = subprocess.CompletedProcess(args=[], returncode=0, stdout="OK\\n__AGENT_NODE_EXEC_NATIVE_V1__=5b222f7573722f62696e2f707974686f6e33225d\\n")'
          if t.count(old) != 1:
              raise SystemExit('runtime-closure CompletedProcess fixture boundary missing')
          t = t.replace(old, new_completed, 1)
          old_patch = '             mock.patch.object(mod, "committed_snapshot", fake_snapshot), \\\n             mock.patch.object(mod.subprocess, "run", return_value=completed) as run:'
          new_patch = '             mock.patch.object(mod, "committed_snapshot", fake_snapshot), \\\n             mock.patch.object(mod, "_runtime_native_sha256", return_value="d" * 64), \\\n             mock.patch.object(mod.subprocess, "run", return_value=completed) as run:'
          if t.count(old_patch) != 1:
              raise SystemExit('runtime-closure mock boundary missing')
          t = t.replace(old_patch, new_patch, 1)
          test.write_text(t, encoding='utf-8')
          PY
          python3 -B -m py_compile agent-node/agent_node.py agent-node/tests/test_runtime_closure.py agent-node/tests/test_dynamic_native_runtime_gap.py
          python3 -B -m unittest discover -s agent-node/tests -v
          git config user.name 'AmazingBecca Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add agent-node/agent_node.py agent-node/tests/test_runtime_closure.py
          git commit -m 'security: bind dynamically loaded native runtime objects'
          git push origin "HEAD:$BRANCH"
