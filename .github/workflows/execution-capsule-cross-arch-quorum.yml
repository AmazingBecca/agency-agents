          bundle=capsule_service.source_bundle_sha256(head)
          pyver='.'.join(str(x) for x in sys.version_info[:3])
          cap=execution_capsule.build(capsule_id='cross-arch-v1',repository='AmazingBecca/quorum-fixture',head=head,tree=tree,source_bundle_sha256=bundle,operation={'kind':'python_unittest','selector':'tests.test_safe'},network_access='none',max_seconds=60,max_output_bytes=20000,required_tools=[{'name':'python','version':pyver}])
          req=urllib.request.Request(base+'/run-capsule',data=cap,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
          result=json.loads(urllib.request.urlopen(req,timeout=30).read())
          toolchain=json.load(open(toolchain_path,encoding='utf-8'))
          env_material={'runner_os':os.environ.get('RUNNER_OS',''),'runner_arch':os.environ.get('RUNNER_ARCH',''),'image_os':os.environ.get('ImageOS',''),'image_version':os.environ.get('ImageVersion',''),'runtime_sha256':result['runtime_sha256'],'toolchain_sha256':toolchain['toolchain_sha256']}
          env_sha=hashlib.sha256((json.dumps(env_material,sort_keys=True,separators=(',',':'))+'\n').encode()).hexdigest()
          receipt={'worker_id':worker_id,'capsule_sha256':result['capsule_sha256'],'source_bundle_sha256':result['source_bundle_sha256'],'head':result['head'],'tree':result['tree'],'runtime_sha256':result['runtime_sha256'],'selector':result['selector'],'returncode':result['returncode'],'stdout_sha256':result['stdout_sha256'],'environment_sha256':env_sha}
          with open(output_path,'a',encoding='utf-8') as f: f.write('receipt='+json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          print('ARM64_CAPSULE_OK', json.dumps(receipt,sort_keys=True))
          PY

  verify-quorum:
    needs: [execute-x64, execute-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fetch exact quorum verifier without workflow credentials
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          unset GITHUB_TOKEN GH_TOKEN
          git init .
          git remote add origin https://github.com/AmazingBecca/agency-agents.git
          git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Require heterogeneous execution agreement
        shell: bash
        env:
          X64_RECEIPT: ${{ needs.execute-x64.outputs.receipt }}
          ARM64_RECEIPT: ${{ needs.execute-arm64.outputs.receipt }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,pathlib,sys,os
          sys.path.insert(0,str(pathlib.Path('agent-node').resolve()))
          import execution_quorum
          receipts=[json.loads(os.environ['X64_RECEIPT']),json.loads(os.environ['ARM64_RECEIPT'])]
          q=execution_quorum.verify_quorum(receipts,threshold=2)
          assert len(set(q['environment_ids'])) == 2
          assert q['consensus']['capsule_sha256'] == receipts[0]['capsule_sha256'] == receipts[1]['capsule_sha256']
          assert q['consensus']['source_bundle_sha256'] == receipts[0]['source_bundle_sha256'] == receipts[1]['source_bundle_sha256']
          print('LIVE_CROSS_ARCH_QUORUM_OK')
          print('quorum_sha256=' + q['quorum_sha256'])
          print('capsule_sha256=' + q['consensus']['capsule_sha256'])
          print('source_bundle_sha256=' + q['consensus']['source_bundle_sha256'])
          print('environment_ids=' + ','.join(q['environment_ids']))
          PY
