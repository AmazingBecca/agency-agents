name: Tasklet Ephemeral Runner Bootstrap Validation

on:
  pull_request:
    paths:
      - runner-bootstrap/tasklet_ephemeral_runner.py
      - tests/test_tasklet_ephemeral_runner.py
      - .github/workflows/tasklet-ephemeral-runner-validation.yml

permissions: {}

jobs:
  validate:
    if: github.repository == 'AmazingBecca/agency-agents'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact public pull-request head without workflow credentials
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          repo="$RUNNER_TEMP/exact-source"
          home="$RUNNER_TEMP/isolated-home"
          mkdir -m 0700 "$repo" "$home"
          export HOME="$home"
          git -C "$repo" init -q
          git -C "$repo" remote add origin https://github.com/AmazingBecca/agency-agents.git
          git -C "$repo" -c http.extraHeader= fetch --no-tags --depth=1 origin "$EXPECTED_HEAD_SHA"
          git -C "$repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          printf '%s\n' "$repo" > "$RUNNER_TEMP/exact-source-path"

      - name: Execute exact bootstrap regressions with minimized environment
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$(cat "$RUNNER_TEMP/exact-source-path")"
          env -i \
            PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            HOME="$RUNNER_TEMP/isolated-test-home" \
            TMPDIR="$RUNNER_TEMP" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            python3 -m py_compile \
              "$repo/runner-bootstrap/tasklet_ephemeral_runner.py" \
              "$repo/tests/test_tasklet_ephemeral_runner.py"
          cd "$repo"
          env -i \
            PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            HOME="$RUNNER_TEMP/isolated-test-home" \
            TMPDIR="$RUNNER_TEMP" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            python3 -m unittest discover -s tests -p 'test_tasklet_ephemeral_runner.py' -v
