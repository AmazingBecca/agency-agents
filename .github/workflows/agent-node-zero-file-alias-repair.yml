name: Agent Node Zero-File Alias Repair

on:
  push:
    branches:
      - hardening/agent-node-native-runtime-closure-v1
    paths:
      - agent-node/repair_zero_file_alias_v26.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch exact repair head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          export PATH='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          test -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)"
          git init .
          git remote add origin 'https://github.com/AmazingBecca/agency-agents.git'
          git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git hash-object agent-node/agent_node.py)" = '6d58e0dee61de0f8b0feb6b05684695f2751db37'
          test "$(git hash-object agent-node/tests/test_native_runtime_zero_file_alias.py)" = '303f26b10680ff3e88c9f7bc2c7af3fe4b183ecd'
      - name: Apply bounded v26 source repair and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 agent-node/repair_zero_file_alias_v26.py
          python3 -B -m py_compile agent-node/agent_node.py
          python3 -B -m unittest discover -s agent-node/tests -v
          git diff --check
          test "$(git diff --name-only)" = 'agent-node/agent_node.py'
      - name: Fast-forward exact repaired source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          START_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          export PATH='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          test "$(git rev-parse HEAD)" = "$START_SHA"
          remote_sha="$(git ls-remote origin refs/heads/hardening/agent-node-native-runtime-closure-v1 | cut -f1)"
          test "$remote_sha" = "$START_SHA"
          git config user.name 'AmazingBecca Automation'
          git config user.email 'amazingbecca@users.noreply.github.com'
          git add agent-node/agent_node.py
          test "$(git diff --cached --name-only)" = 'agent-node/agent_node.py'
          git commit -m 'security: bind zero-file PT_LOAD page aliases'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/AmazingBecca/agency-agents.git"
          git push origin HEAD:refs/heads/hardening/agent-node-native-runtime-closure-v1
