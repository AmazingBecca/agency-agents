name: Agent Node Candidate Validation

on:
  push:
    branches:
      - hardening/agent-node-exact-worktree-v1
      - hardening/execution-receipt-quorum-v1
      - hardening/execution-capsule-toolchain-v1
  pull_request:
    branches:
      - infra/agent-node-bootstrap-v1
      - hardening/agent-node-exact-worktree-v1
      - hardening/execution-receipt-quorum-v1
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch exact candidate source without workflow credentials
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          export PATH='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          unset GITHUB_TOKEN GH_TOKEN
          test -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)"
          git init .
          git remote add origin 'https://github.com/AmazingBecca/agency-agents.git'
          git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Bootstrap and fingerprint pinned deterministic toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          export AGENT_NODE_TOOLCHAIN_DIR="$RUNNER_TEMP/amazingbecca-tools"
          bash agent-node/bootstrap_toolchain.sh
          RUFF="$AGENT_NODE_TOOLCHAIN_DIR/ruff-venv/bin/ruff"
          AST_GREP="$AGENT_NODE_TOOLCHAIN_DIR/ast-grep/node_modules/.bin/ast-grep"
          "$RUFF" check --select E9,F63,F7,F82 agent-node
          "$AST_GREP" --pattern 'subprocess.run($$$ARGS)' --lang python agent-node/agent_node.py >/dev/null
          python3 -B agent-node/toolchain_fingerprint.py "$RUFF" "$AST_GREP" | tee "$RUNNER_TEMP/toolchain-fingerprint.json"
          python3 - "$RUNNER_TEMP/toolchain-fingerprint.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          assert value['schema']=='amazingbecca-toolchain-fingerprint/v1'
          assert len(value['toolchain_sha256'])==64
          assert [x['name'] for x in value['tools']]==['ast-grep','ruff']
          assert value['tools'][0]['version'].endswith('0.45.1')
          assert value['tools'][1]['version']=='ruff 0.16.3'
          print('TOOLCHAIN_FINGERPRINT_OK=' + value['toolchain_sha256'])
          PY

      - name: Compile and run exact agent-node regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -B -m py_compile \
            agent-node/agent_node.py \
            agent-node/execution_quorum.py \
            agent-node/execution_capsule.py \
            agent-node/capsule_service.py \
            agent-node/toolchain_fingerprint.py \
            agent-node/tests/test_agent_node.py \
            agent-node/tests/test_execution_quorum.py \
            agent-node/tests/test_execution_capsule.py
          python3 -B -m unittest discover -s agent-node/tests -v

      - name: Exercise live authenticated loopback capsule service
        shell: bash
        run: |
          set -Eeuo pipefail
          fixture="$RUNNER_TEMP/agent-node-fixture"
          mkdir -p "$fixture/tests"
          git -C "$fixture" init -q
          git -C "$fixture" config user.email 'agent-node-ci@example.invalid'
          git -C "$fixture" config user.name 'agent-node-ci'
          printf '' > "$fixture/tests/__init__.py"
          cat > "$fixture/tests/test_safe.py" <<'PY'
          import unittest
          class SafeTest(unittest.TestCase):
              def test_live(self):
                  self.assertEqual(2 + 2, 4)
          PY
          git -C "$fixture" add tests
          git -C "$fixture" commit -qm reviewed
          expected_head="$(git -C "$fixture" rev-parse HEAD)"
          expected_tree="$(git -C "$fixture" rev-parse 'HEAD^{tree}')"
          export AGENT_NODE_REPO_ROOT="$fixture"
          export AGENT_NODE_REPOSITORY='AmazingBecca/fixture'
          export AGENT_NODE_BEARER="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export AGENT_NODE_TEST_ALLOWLIST='tests.test_safe'
          python3 -B agent-node/capsule_service.py > "$RUNNER_TEMP/agent-node.log" 2>&1 &
          node_pid=$!
          trap 'kill "$node_pid" 2>/dev/null || true' EXIT
          python3 - "$expected_head" "$expected_tree" "$AGENT_NODE_BEARER" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.request

          head, tree, token = sys.argv[1:4]
          sys.path.insert(0, str(pathlib.Path('agent-node').resolve()))
          import capsule_service
          import execution_capsule

          base = "http://127.0.0.1:8765"
          for _ in range(50):
              try:
                  with urllib.request.urlopen(base + "/health", timeout=1) as response:
                      assert json.loads(response.read()) == {"git": True, "ok": True}
                  break
              except Exception:
                  time.sleep(0.1)
          else:
              raise SystemExit("capsule service did not become ready")

          bundle = capsule_service.source_bundle_sha256(head)
          capsule = execution_capsule.build(
              capsule_id="public-ci-fixture",
              repository="AmazingBecca/fixture",
              head=head,
              tree=tree,
              source_bundle_sha256=bundle,
              operation={"kind": "python_unittest", "selector": "tests.test_safe"},
              network_access="none",
              max_seconds=60,
              max_output_bytes=20000,
              required_tools=[{"name": "python", "version": ".".join(str(x) for x in sys.version_info[:3])}],
          )
          unauthorized = urllib.request.Request(base + "/run-capsule", data=capsule, headers={"Content-Type": "application/json"}, method="POST")
          try:
              urllib.request.urlopen(unauthorized, timeout=5)
          except urllib.error.HTTPError as exc:
              assert exc.code == 401
          else:
              raise SystemExit("unauthenticated capsule execution unexpectedly succeeded")

          authorized = urllib.request.Request(
              base + "/run-capsule",
              data=capsule,
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(authorized, timeout=30) as response:
              result = json.loads(response.read())
          expected_capsule = execution_capsule.parse(capsule)["capsule_sha256"]
          assert result["capsule_sha256"] == expected_capsule
          assert result["source_bundle_sha256"] == bundle
          assert result["head"] == head and result["tree"] == tree
          assert len(result["runtime_sha256"]) == 64
          assert result["selector"] == "tests.test_safe"
          assert result["returncode"] == 0
          assert hashlib.sha256(result["stdout"].encode()).hexdigest() == result["stdout_sha256"]
          assert result["advisory_only"] is True
          assert result["promotion_authorized"] is False
          assert result["completion_authorized"] is False
          print("LIVE_EXECUTION_CAPSULE_OK")
          print("capsule_sha256=" + result["capsule_sha256"])
          print("source_bundle_sha256=" + result["source_bundle_sha256"])
          print("runtime_sha256=" + result["runtime_sha256"])
          print("stdout_sha256=" + result["stdout_sha256"])
          PY
