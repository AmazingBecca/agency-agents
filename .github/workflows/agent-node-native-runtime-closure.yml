name: Agent Node Native Runtime Closure Validation

on:
  push:
    branches:
      - hardening/agent-node-native-runtime-closure-v1
  pull_request:
    branches:
      - hardening/agent-node-runtime-closure-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact candidate source without workflow credentials
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          export PATH='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          unset GITHUB_TOKEN GH_TOKEN
          test -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)"
          git init .
          git remote add origin 'https://github.com/AmazingBecca/agency-agents.git'
          git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=2 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile and run exact native-runtime regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          cc --version | head -n 1
          python3 -B -m py_compile \
            agent-node/agent_node.py \
            agent-node/tests/test_agent_node.py \
            agent-node/tests/test_agent_node_adversarial_paths.py \
            agent-node/tests/test_runtime_closure.py \
            agent-node/tests/test_runtime_zip_archive.py \
            agent-node/tests/test_native_runtime_closure.py
          python3 -B -m unittest discover -s agent-node/tests -v
      - name: Apply exact-bound v17 repair
        if: >-
          ${{ always() && github.event_name == 'push' && github.event.before == 'e52362838796fe8f18fb0417c09a81f39df5bdea' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: e52362838796fe8f18fb0417c09a81f39df5bdea
          EXPECTED_SOURCE_BLOB: 19c063f55eccaa105069c10f281e5ceca4dec65f
        run: |
          set -Eeuo pipefail
          export PATH='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git hash-object agent-node/agent_node.py)" = "$EXPECTED_SOURCE_BLOB"
          python3 .github/repair/apply_agent_node_v17.py
          test "$(git hash-object agent-node/agent_node.py)" = '3ca9ab44c88287a67c5c76628e82a1d9677af86b'
          test "$(git hash-object agent-node/tests/test_native_runtime_multiline_spoof.py)" = '2ed0238e6c2a7462143b86d7a6609f2952ed5326'
          python3 -B -m py_compile agent-node/agent_node.py agent-node/tests/test_native_runtime_multiline_spoof.py
          python3 -B -m unittest discover -s agent-node/tests -v
          git add agent-node/agent_node.py agent-node/tests/test_native_runtime_multiline_spoof.py
          git diff --cached --check
          git config user.name 'AmazingBecca Agent Repair'
          git config user.email '134438105+AmazingBecca@users.noreply.github.com'
          git commit -m 'security: validate ELF dependency record boundaries'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c credential.helper= -c "http.extraHeader=AUTHORIZATION: basic $auth" push origin HEAD:hardening/agent-node-native-runtime-closure-v1
