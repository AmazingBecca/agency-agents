name: Agent Node v27 Zero-Mem Alias Repair

on:
  push:
    branches:
      - hardening/agent-node-native-runtime-closure-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'AmazingBecca'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact repair staging head
        shell: bash
        env:
          EXPECTED_PARENT: 8410cc400f6a3d86c602bf61ba90cc162e063865
          EXPECTED_SOURCE_BLOB: febd1f2ae6be05eaf0b53901722ca9ae3484dc16
          EXPECTED_TEST_BLOB: 9fca52cc6700212b6cb3f7c92af83ceeb5b2f681
          EXPECTED_APPLICATOR_BLOB: ea71e83f7bf22e86e9ea151b72c47a00343530f8
        run: |
          set -Eeuo pipefail
          export PATH='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          test -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)"
          git init .
          git remote add origin 'https://github.com/AmazingBecca/agency-agents.git'
          git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git hash-object agent-node/agent_node.py)" = "$EXPECTED_SOURCE_BLOB"
          test "$(git hash-object agent-node/tests/test_native_runtime_zero_mem_alias.py)" = "$EXPECTED_TEST_BLOB"
          test "$(git hash-object agent-node/tools/apply_v27_zero_mem_alias_fix.py)" = "$EXPECTED_APPLICATOR_BLOB"
      - name: Apply exact repair and prove complete suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 agent-node/tools/apply_v27_zero_mem_alias_fix.py
          test "$(git diff --name-only)" = 'agent-node/agent_node.py'
          python3 -B -m py_compile agent-node/agent_node.py agent-node/tests/*.py
          python3 -B -m unittest discover -s agent-node/tests -v
      - name: Commit and non-forced fast-forward exact repair
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: hardening/agent-node-native-runtime-closure-v1
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'AmazingBecca Automation'
          git config user.email '134438105+AmazingBecca@users.noreply.github.com'
          git add agent-node/agent_node.py
          git commit -m 'security: bind zero-file zero-memory PT_LOAD page alias'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/AmazingBecca/agency-agents.git"
          git push origin "HEAD:refs/heads/$BRANCH"
